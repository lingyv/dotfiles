# -- general -------------------------------------------------------------------

unbind C-b
set -g prefix C-g
bind C-g send-prefix -2

set -g default-terminal "screen-256color" # colors!
setw -g xterm-keys on
set -s escape-time 10                     # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on
set -g mouse on
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION TERM TERMINFO TERMINFO_DIRS TERM_PROGRAM TERM_PROGRAM_VERSION WINDOWID XAUTHORITY"

# reload configuration
bind -N "Reload configuration" r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# -- extended keys & passthrough ------------------------------------------------
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -g allow-passthrough on

# -- no-prefix shortcuts --------------------------------------------------------
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"

# -- navigation ----------------------------------------------------------------

# create session
bind -N "Create new session" C-c new-session

# find session
bind -N "Find and switch session" C-f command-prompt -p find-session 'switch-client -t %%'

# split current window horizontally
bind -N "Split pane horizontally" - split-window -v
# split current window vertically
bind -N "Split pane vertically" _ split-window -h

# pane navigation
bind -N "Focus pane left" -r h select-pane -L  # move left
bind -N "Focus pane down" -r j select-pane -D  # move down
bind -N "Focus pane up" -r k select-pane -U  # move up
bind -N "Focus pane right" -r l select-pane -R  # move right
bind -N "Swap pane down" > swap-pane -D       # swap current pane with the next one
bind -N "Swap pane up" < swap-pane -U       # swap current pane with the previous one

# maximize current pane
bind -N "Maximize current pane" + run 'cut -c3- ~/.tmux.conf | sh -s _maximize_pane "#{session_name}" #D'

# pane resizing
bind -N "Resize pane left" -r H resize-pane -L 2
bind -N "Resize pane down" -r J resize-pane -D 2
bind -N "Resize pane up" -r K resize-pane -U 2
bind -N "Resize pane right" -r L resize-pane -R 2

# window navigation
unbind n
unbind p
bind -N "Previous window" -r C-h previous-window # select previous window
bind -N "Next window" -r C-l next-window     # select next window
bind -N "Last active window" Tab last-window        # move to last active window

# -- urlview -------------------------------------------------------------------

bind -N "Open URLs in pane" U run "cut -c3- ~/.tmux.conf | sh -s _urlview #{pane_id}"

# -- facebook pathpicker -------------------------------------------------------

bind -N "Open files with pathpicker" F run "cut -c3- ~/.tmux.conf | sh -s _fpp #{pane_id}"

# -- list choice (tmux < 2.4) --------------------------------------------------

# vi-choice is gone in tmux >= 2.4
run -b 'tmux bind -t vi-choice h tree-collapse 2> /dev/null || true'
run -b 'tmux bind -t vi-choice l tree-expand 2> /dev/null || true'
run -b 'tmux bind -t vi-choice K start-of-list 2> /dev/null || true'
run -b 'tmux bind -t vi-choice J end-of-list 2> /dev/null || true'
run -b 'tmux bind -t vi-choice H tree-collapse-all 2> /dev/null || true'
run -b 'tmux bind -t vi-choice L tree-expand-all 2> /dev/null || true'
run -b 'tmux bind -t vi-choice Escape cancel 2> /dev/null || true'


# -- edit mode (tmux < 2.4) ----------------------------------------------------

# vi-edit is gone in tmux >= 2.4
run -b 'tmux bind -ct vi-edit H start-of-line 2> /dev/null || true'
run -b 'tmux bind -ct vi-edit L end-of-line 2> /dev/null || true'
run -b 'tmux bind -ct vi-edit q cancel 2> /dev/null || true'
run -b 'tmux bind -ct vi-edit Escape cancel 2> /dev/null || true'

# -- copy mode -----------------------------------------------------------------

bind -N "Enter copy mode" Enter copy-mode # enter copy mode

run -b 'tmux bind -t vi-copy v begin-selection 2> /dev/null || true'
run -b 'tmux bind -T copy-mode-vi v send -X begin-selection 2> /dev/null || true'
run -b 'tmux bind -t vi-copy C-v rectangle-toggle 2> /dev/null || true'
run -b 'tmux bind -T copy-mode-vi C-v send -X rectangle-toggle 2> /dev/null || true'
run -b 'tmux bind -t vi-copy y copy-selection 2> /dev/null || true'
run -b 'tmux bind -T copy-mode-vi y send -X copy-selection-and-cancel 2> /dev/null || true'
run -b 'tmux bind -t vi-copy Escape cancel 2> /dev/null || true'
run -b 'tmux bind -T copy-mode-vi Escape send -X cancel 2> /dev/null || true'
run -b 'tmux bind -t vi-copy H start-of-line 2> /dev/null || true'
run -b 'tmux bind -T copy-mode-vi H send -X start-of-line 2> /dev/null || true'
run -b 'tmux bind -t vi-copy L end-of-line 2> /dev/null || true'
run -b 'tmux bind -T copy-mode-vi L send -X end-of-line 2> /dev/null || true'

# copy to X11 clipboard
if -b 'command -v xsel > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | xsel -i -b"'
if -b '! command -v xsel > /dev/null 2>&1 && command -v xclip > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1"'
# copy to macOS clipboard
if -b 'command -v pbcopy > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | pbcopy"'
if -b 'command -v reattach-to-user-namespace > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | reattach-to-user-namespace pbcopy"'
# copy to Windows clipboard
if -b 'command -v clip.exe > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | clip.exe"'
if -b '[ -c /dev/clipboard ]' 'bind y run -b "tmux save-buffer - > /dev/clipboard"'

# -- buffers -------------------------------------------------------------------

# bind b list-buffers  # list paste buffers
# bind p paste-buffer  # paste from the top paste buffer
# bind P choose-buffer # choose which buffer to paste from

# -- popup -------------------------------------------------------------------
# 空白弹窗
bind -N "Open popup window" p popup -w 80% -h 80% -b rounded

# 持久 popup 会话（推荐）
bind -N "Open persistent popup session" P popup -w 90% -h 90% -b rounded 'tmux attach -t popup || tmux new -s popup'

# fzf 选会话 → 弹出该会话（prefix + S）
bind -N "Select session in popup" S popup -w 90% -h 90% -b rounded \
'bash -c '\''
  sel=$(tmux list-sessions -F "#{session_name}" 2>/dev/null | fzf --exit-0 --prompt="Select or type new name: " --preview "tmux list-windows -t {}" --preview-window right:30%);
  if [ -n "$sel" ]; then
    tmux attach -t "$sel" 2>/dev/null || tmux new -s "$sel"
  else
    tmux new
  fi
'\'''

# -- display -------------------------------------------------------------------

# default theme
tmux_conf_theme_colour_1="#080808"    # dark gray
tmux_conf_theme_colour_2="#303030"    # gray
tmux_conf_theme_colour_3="#8a8a8a"    # light gray
tmux_conf_theme_colour_4="#00afff"    # light blue
tmux_conf_theme_colour_5="#ffff00"    # yellow
tmux_conf_theme_colour_7="#e4e4e4"    # white
tmux_conf_theme_colour_8="#ff00af"   # pink
tmux_conf_theme_colour_9="#5fff00"   # green
tmux_conf_theme_color_10="#d70000"   # red

set -g message-style "bg=$tmux_conf_theme_colour_5, fg=$tmux_conf_theme_colour_1"
set -g mode-style "bg=colour198,fg=colour0"

set -g status-style "bg=$tmux_conf_theme_colour_1, fg=$tmux_conf_theme_colour_3"
set -g status-left "#[bg=$tmux_conf_theme_colour_5] ❐ #S "
set -g status-left-length 400
set -g status-right "#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=$tmux_conf_theme_colour_3] #h |#[fg=$tmux_conf_theme_colour_3] %Y-%m-%d %H:%M "
set -g status-right-length 600

set -wg window-status-format " #I #W "
set -wg window-status-current-format " #I #W "
set -wg window-status-separator ""
set -wg window-status-current-style "bg=$tmux_conf_theme_colour_8"
set -wg window-status-last-style "fg=$tmux_conf_theme_colour_4"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
run '~/.tmux/plugins/tpm/tpm'

bind-key -N "Connect to sesh session" "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind -N "Kill pane without confirmation" x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session
